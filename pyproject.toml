[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magnifica-humanitas-mcp"
version = "0.1.2"
description = "MCP server for navigating the encyclical Magnifica Humanitas (Pope Leo XIV, 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.scripts]
magnifica-humanitas-mcp = "magnifica_humanitas_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magnifica_humanitas_mcp"]
